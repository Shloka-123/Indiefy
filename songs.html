<!DOCTYPE html>
<html>
<head>
<title>Discover | Indiefy</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins;
background:#faf6f2;
color:#3a2b21;
}

/* NAV */

nav{
display:flex;
justify-content:space-between;
padding:25px 8%;
}

.logo{
font-family:'Playfair Display',serif;
font-size:40px;
}

nav a{
text-decoration:none;
margin-left:25px;
color:#5c3b28;
}

/* PAGE */

.container{
max-width:1100px;
margin:auto;
padding:60px 20px;
}

h1{
font-family:'Playfair Display',serif;
font-size:50px;
margin-bottom:40px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:30px;
}

/* CARD */

.card{
background:white;
border-radius:14px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
transition:.25s;
}

.card:hover{
transform:translateY(-6px);
}

/* ALBUM COVER */

.cover{
width:100%;
height:220px;
object-fit:cover;
}

/* SONG INFO */

.card-body{
padding:16px;
}

.song{
font-size:17px;
font-weight:600;
margin-bottom:4px;
}

.artist{
opacity:.6;
font-size:14px;
margin-bottom:14px;
}

/* BUTTON */

button{
background:#5c3b28;
border:none;
padding:10px 16px;
border-radius:8px;
color:white;
cursor:pointer;
}

button:hover{
background:#3f281c;
}

</style>
</head>

<body>

<nav>

<div class="logo">Indiefy</div>

<div>
<a href="index.html">Home</a>
<a href="songs.html">Discover</a>
</div>

</nav>

<div class="container">

<h1>Explore Indie Songs</h1>

<div class="grid" id="songs"></div>

</div>

<script>

fetch("http://localhost:3000/songs")
.then(res=>res.json())
.then(data=>{

let container=document.getElementById("songs")

data.forEach(song=>{

let spotifySearch =
`https://open.spotify.com/search/${encodeURIComponent(song.title + " " + song.artist)}`

let card=document.createElement("div")
card.className="card"

card.innerHTML=`

<img class="cover" src="${song.cover_url}">

<div class="card-body">

<div class="song">${song.title}</div>

<div class="artist">${song.artist}</div>

<a href="${spotifySearch}" target="_blank">
<button>Open in Spotify</button>
</a>

</div>
`

container.appendChild(card)

})

})

</script>

</body>
</html>
